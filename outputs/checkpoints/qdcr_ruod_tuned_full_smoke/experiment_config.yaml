experiment:
  name: qdcr_ruod_tuned_full_smoke
  seed: 42
  output_dir: outputs/checkpoints/qdcr_ruod_tuned_full_smoke
  runs_dir: runs/qdcr_ruod_tuned_full_smoke
  device: cuda
dataset:
  name: ruod
  train_root: data/datasets/downloads/RUOD/RUOD/train/images
  val_root: data/datasets/downloads/RUOD/RUOD/valid/images
  enhanced_root: data/datasets/downloads/RUOD/RUOD/train/images
  num_classes: 4
  synthetic_size: 0
  max_objects: 16
  class_names:
  - holothurian
  - echinus
  - starfish
  - scallop
  image_size: 640
  workers: 4
  prefetch_factor: 2
  cache_preprocessed: false
  cache_dir: /tmp/qdcr_preprocessed/ruod_smoke
model:
  name: qdcr_net
  feature_dim: 64
  num_queries: 16
  backbone: dual_branch
  quality_aware: true
  cross_residual_stages:
  - stage2
  - stage3
  small_object_neck: true
train:
  epochs: 1
  batch_size: 100
  max_batches_per_epoch: 2
  log_interval: 1
  scalar_log_interval: 1
  eval_interval: 1
  amp: true
  log_graph: false
  log_histograms: false
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0005
  early_stopping:
    enabled: false
    monitor: loss
    mode: min
    patience: 15
    min_delta: 0.0005
eval:
  checkpoint: best
  max_batches: 1
  conf_thresh: 0.05
  iou_thresh: 0.5
